<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 背景层（浅色）：极浅的冷灰渐变，给系统高光/折射留余地，不要纯白死板 -->
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFCFE"/>
      <stop offset="1" stop-color="#E8EBF1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgLight)"/>
</svg>
