<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 前景层 1：雷达扫描盘。环两端半圆头 + 三个同宽的点；
       点每 21° 一个（-21/0/21°），缺口 84°，让"环端→点"的缝隙
       与"点→点"的缝隙一样宽（35.9pt） -->
  <!-- 三个点的颜色对应箭头尾部的色阶：中间点 = 尾端最深（最外）层，两侧点 = 中间层 -->
  <g>
    <!-- 周长 1837.83：画 1409.0（276°）、空 428.83（84°），转 -48° 让缺口居中于正上方 -->
    <circle cx="512" cy="512" r="292.5" fill="none" stroke="#1B1C1F" stroke-width="70"
            stroke-linecap="round" stroke-dasharray="1409.0 428.83"
            transform="rotate(-48 512 512)"/>
    <circle cx="407.2" cy="238.8" r="35" fill="#4A4B50"/>
    <circle cx="512" cy="219.5" r="35" fill="#7E7F84"/>
    <circle cx="616.8" cy="238.8" r="35" fill="#4A4B50"/>
  </g>
</svg>
