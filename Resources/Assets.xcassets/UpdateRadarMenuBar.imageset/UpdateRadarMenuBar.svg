<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!--
    更新雷达 · 菜单栏图标（template image）

    菜单栏走 template 渲染：只保留 alpha，系统按菜单栏明暗自动反色。
    因此不需要明暗双模，只需这一份单色剪影。

    关键约束（与 Dock 图标完全不同）：
    · 实际显示约 17pt，比 Dock 小得多 → 笔画要比 Dock 版粗一档
    · 元素 ≤ 3（开口环 + 三个点 + 箭头），再多会糊
    · 四周留白 ≥ 10%（内容占 16/22）
    · 外框是正圆：扫描时的"雷达波"涟漪是同心圆往外扩，图标本身必须是圆的才协调

    造型与 Dock 图标（AppIcon37）一致：开口环 + 三个同宽的点，缺口居中正上。
    按 1024 画布等比缩到 22：环 r=292.5/1024×22≈7.6，描边 70/1024×22≈2，
    点半径 = 描边一半 = 1，点间距 21°。
    缺口取 96°（Dock 版是 84°）：小尺寸下 84° 的两侧点会和环端糊在一起，
    放大到 96° 三点才分得开——这是为 17pt 做的光学补偿。

    注意 y 轴：SVG 是 y 向下，箭头要朝下（下载），所以箭尖的 y 比箭杆末端大。
    （原稿把箭头写反了，渲染出来是朝上；Xcode 的 SVG 解析按 y 向下画，不会自动翻。）
  -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- 扫描盘：开口环，缺口 96° 居中正上（周长 47.75：画 35.02、空 12.73，转 -42°） -->
    <circle cx="11" cy="11" r="7.6" stroke-width="2"
            stroke-dasharray="35.02 12.73" transform="rotate(-42 11 11)"/>
    <!-- 三个点，与环同粗（直径 2），骑在环的中线上：±21° 与正上 -->
    <g fill="#000" stroke="none">
      <circle cx="8.277" cy="3.904" r="1"/>
      <circle cx="11" cy="3.4" r="1"/>
      <circle cx="13.723" cy="3.904" r="1"/>
    </g>
    <!-- 箭杆 -->
    <line x1="11" y1="7.48" x2="11" y2="13.08" stroke-width="2.32"/>
    <!-- 箭头（朝下） -->
    <polyline points="7.56,11.64 11,14.84 14.44,11.64" stroke-width="2.32"/>
  </g>
</svg>
